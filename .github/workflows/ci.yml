name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-policy:
    name: Frontend platform review policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require frontend-platform ownership of every file
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rules = [
              line.split()
              for line in Path('.github/CODEOWNERS').read_text().splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          ]
          if rules != [['*', '@langchain-ai/frontend-platform']]:
              raise SystemExit(
                  'CODEOWNERS must assign every file exclusively to '
                  '@langchain-ai/frontend-platform, without path overrides.'
              )
          PY

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: corepack enable
      - run: corepack prepare pnpm@10.27.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:package
      - run: pnpm build:storybook
      - run: node scripts/pack.mjs
