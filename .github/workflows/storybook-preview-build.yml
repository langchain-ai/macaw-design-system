# Builds Storybook from the pull request and uploads the static site.
# This workflow runs pull request code, including changes to this file. It has
# no cloud credentials, no OIDC token, and no write permissions. Publishing is
# done by storybook-preview-publish.yml from main, which does not execute
# anything from the pull request.

name: Build Storybook preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: storybook-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-storybook.yml
