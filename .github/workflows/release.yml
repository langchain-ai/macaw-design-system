name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Require a release from reviewed main history
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::Release tags must point to a commit merged into main through the required review process.'
            exit 1
          fi
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node scripts/verify-release-tag.mjs "${{ github.event.release.tag_name }}"
      - run: corepack enable
      - run: corepack prepare pnpm@10.27.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/pack.mjs
      - run: pnpm release:publish --access public
