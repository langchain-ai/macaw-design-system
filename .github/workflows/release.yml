name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  storybook:
    uses: ./.github/workflows/build-storybook.yml

  version:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.merged.outputs.released }}
      tag: ${{ steps.merged.outputs.tag }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect merged release PR
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.mjs

      - name: Tag merged release
        if: steps.merged.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.merged.outputs.tag }}
          TARGET_SHA: ${{ steps.merged.outputs.target_sha }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"
          else
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Version workspace
        if: steps.merged.outputs.released != 'true'
        id: version
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          pnpm nx release version --git-tag=false --git-commit-message="chore(release): publish {version}"
          after=$(git rev-parse HEAD)

          if [ "$before" = "$after" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected_files=$(git diff --name-only "$before" "$after" \
            | grep -Ev '^(pnpm-lock\.yaml|packages/[^/]+/package\.json)$' || true)
          if [ -n "$unexpected_files" ]; then
            echo "versioning changed files not represented by the CI build:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi

          tag="v$(node -p "require('./packages/components/package.json').version")"
          node scripts/verify-release-tag.mjs "$tag"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          branch="release/$RELEASE_TAG"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --head "$branch" --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "Release PR already open for $RELEASE_TAG; merge or close it before preparing another."
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git diff --exit-code FETCH_HEAD HEAD
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore(release): publish $RELEASE_TAG" \
            --body "Coordinated Nx version update. Review and merge this PR to tag and publish $RELEASE_TAG. GitHub-token-created PRs do not automatically trigger CI: close/reopen this PR as a maintainer to trigger checks before merging."

  publish:
    if: needs.version.outputs.released == 'true'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release packages
        run: pnpm build-all

      - name: Verify package exports and version
        run: pnpm verify:package

      - name: Verify packed packages
        run: node scripts/pack.mjs

      - name: Publish packages
        run: pnpm release:publish --access public

  pages:
    needs: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Storybook build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: storybook-static

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: storybook-static
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  github-release:
    if: needs.version.outputs.released == 'true'
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Create GitHub release
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$RELEASE_TAG"
