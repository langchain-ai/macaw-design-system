name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      prepare_release: true

  storybook:
    uses: ./.github/workflows/build-storybook.yml

  version:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    outputs:
      released: ${{ steps.version.outputs.released }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version workspace
        id: version
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          pnpm nx release version
          after=$(git rev-parse HEAD)

          if [ "$before" = "$after" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected_files=$(git diff --name-only "$before" "$after" \
            | grep -Ev '^(pnpm-lock\.yaml|packages/[^/]+/package\.json)$' || true)
          if [ -n "$unexpected_files" ]; then
            echo "versioning changed files not represented by the CI build:" >&2
            echo "$unexpected_files" >&2
            exit 1
          fi

          mapfile -t release_tags < <(git tag --points-at "$after")
          if [ "${#release_tags[@]}" -ne 1 ]; then
            echo "expected exactly one release tag on the version commit" >&2
            exit 1
          fi

          tag="${release_tags[0]}"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Nx created an unexpected release tag" >&2
            exit 1
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release app token
        if: steps.version.outputs.released == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.LANGCHAIN_ACTIONS_PR_BOT_PUBLIC_APP_ID }}
          private-key: ${{ secrets.LANGCHAIN_ACTIONS_PR_BOT_PUBLIC_PRIVATE_KEY }}
          permission-contents: write

      - name: Push version commit and tag
        if: steps.version.outputs.released == 'true'
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          auth_header=$(printf 'x-access-token:%s' "$GH_APP_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            push --atomic origin HEAD:main "refs/tags/${RELEASE_TAG}"

  publish:
    if: needs.version.outputs.released == 'true'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download CI build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-build-${{ github.sha }}
          path: packages

      - name: Verify package exports and version
        run: pnpm verify:package

      - name: Verify packed packages
        run: node scripts/pack.mjs

      - name: Publish packages
        run: pnpm release:publish --access public

  pages:
    needs: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Storybook build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: storybook-static

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: storybook-static

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  github-release:
    if: needs.version.outputs.released == 'true'
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Create GitHub release
        run: >-
          gh release create "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$RELEASE_TAG"
