name: Publish to npm

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify and publish
        required: true
        type: string
      artifact_run_id:
        description: CI run containing the npm build artifact
        required: false
        type: string
        default: ''
      artifact_name:
        description: npm build artifact name
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Enable dependency firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - name: Verify release tag
        run: node scripts/verify-release-tag.mjs "$RELEASE_TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download CI build
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: packages
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Build packages
        if: inputs.artifact_run_id == ''
        run: pnpm build-all

      - name: Check build artifact
        run: |
          set -euo pipefail
          for directory in \
            packages/components/dist \
            packages/tokens/dist \
            packages/cli/dist
          do
            test -d "$directory"
            test -n "$(find "$directory" -type f -print -quit)"
          done
          if find packages/*/dist -type l -print -quit | grep -q .; then
            echo "refusing to publish build outputs containing symlinks" >&2
            exit 1
          fi

      - name: Verify package exports and version
        run: pnpm verify:package

      - name: Verify packed packages
        run: node scripts/pack.mjs

      - name: Publish packages
        run: pnpm release:publish --access public
