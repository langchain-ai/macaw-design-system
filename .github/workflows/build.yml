name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test components
        run: pnpm test

      - name: Test release automation
        run: node --test scripts/*.test.mjs

      - name: Verify coordinated version
        run: |
          version=$(node -p "require('./packages/components/package.json').version")
          node scripts/verify-release-tag.mjs "v$version"

      - name: Build packages
        run: pnpm build-all

      - name: Verify package outputs
        run: pnpm verify:package

      - name: Verify packed packages
        run: node scripts/pack.mjs

      - name: Verify Nx publication without publishing
        if: matrix.node-version == 24
        run: pnpm release:publish --access public --dry-run
