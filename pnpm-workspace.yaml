packages:
  - packages/*

overrides:
  # Nx 23.2.1 pins a version affected by a malformed-TOML denial of service.
  nx>smol-toml: 1.9.0
  # Nx 23.2.1 currently resolves vulnerable transitive versions.
  axios: 1.20.0
  brace-expansion: 5.0.12
  tinypool: 2.1.2
  tailwindcss@3>postcss-selector-parser: 7.1.6
  postcss-nested@6>postcss-selector-parser: 7.1.6

# These themes import highlight without declaring it in their manifests.
packageExtensions:
  '@uiw/codemirror-theme-tokyo-night-day@4.25.11':
    dependencies:
      '@lezer/highlight': ^1.2.0
  '@uiw/codemirror-theme-tokyo-night-storm@4.25.11':
    dependencies:
      '@lezer/highlight': ^1.2.0
allowBuilds:
  '@parcel/watcher': false
  nx: true
  esbuild: true
